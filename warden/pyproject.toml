[project]
name = "warden"
version = "0.1.0"
description = "Agentic cloud-security alert triage with a first-class evaluation harness"
requires-python = ">=3.10"
dependencies = [
    "anthropic==1.9.0",
    "python-dotenv>=1.0",
    "fastmcp==4.0.10",  # pulls mcp==2.2.0 (implements 2026-07-28). Frozen 2026-09-30.
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Runbook-RAG only. Kept out of the core install so the loop and its tests never need torch.
rag = ["rank-bm25==0.2.2", "sentence-transformers==6.1.0"]
# Week 3 orchestration. Frozen 2026-10-24; the transitive pins are listed in docs/week3-notes.md.
graph = [
    "langgraph==1.2.17",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
